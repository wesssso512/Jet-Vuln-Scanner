name: CI

on:
  push:
    branches: [V2]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: CLI smoke test
        run: |
          jet --version
          jet modules

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t jetscanner .
      - name: Smoke test image
        run: docker run --rm jetscanner modules
